# GitHub Pages 自动部署：push 到 main 即构建发布。
# 仓库 Settings → Pages → Source 需选择 "GitHub Actions"。
# 正式域名：https://dda1988.github.io
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 本地 lock 只在 Windows 上生成，缺少 Linux 的 Rollup 可选依赖；
      # 删除后让 npm 在 Linux 上重新解析，避开 npm/cli#4828。
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
